<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Diario Posturale
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Diario Posturale</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- TASK-502: Sviluppo UI del Diario Posturale -->
  <div class="ion-padding ion-text-center">
    <ion-button (click)="takePicture()">
      Scatta Foto
    </ion-button>
  </div>

  <ion-grid>
    <ion-row>
      @for (photo of photos; track $index) {
        <ion-col size="6">
          <ion-img [src]="photo"></ion-img>
        </ion-col>
      }
    </ion-row>
  </ion-grid>
</ion-content>
