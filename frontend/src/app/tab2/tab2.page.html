<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Diario Posturale</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Diario Posturale</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- TASK-502: Griglia foto a due colonne con click per preview e cestino per eliminazione -->
  @if (photos.length === 0) {
    <div class="empty-state">
      <ion-icon name="camera-outline" class="empty-icon"></ion-icon>
      <p>Nessuna foto ancora.<br>Premi il pulsante per aggiungere una foto posturale.</p>
    </div>
  }

  <ion-grid class="photo-grid">
    <ion-row>
      @for (photo of photos; track $index; let i = $index) {
        <ion-col size="6">
          <!-- TASK-502: card foto con tap per anteprima e bottone cestino -->
          <div class="photo-card">
            <ion-img
              [src]="photo"
              class="photo-img"
              (click)="openPreview(photo)"
            ></ion-img>
            <ion-button
              class="delete-btn"
              size="small"
              fill="solid"
              color="danger"
              shape="round"
              (click)="deletePhoto(i)"
              aria-label="Elimina foto"
            >
              <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
            </ion-button>
          </div>
        </ion-col>
      }
    </ion-row>
  </ion-grid>

  <!-- TASK-502: FAB fisso in basso a destra per scattare/scegliere foto -->
  <!-- (click) esplicito su ion-fab-button, non sul genitore ion-fab -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="takePicture()" aria-label="Aggiungi foto">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- TASK-502: Modal anteprima full-screen -->
  <ion-modal
    [isOpen]="selectedPhoto !== null"
    (didDismiss)="closePreview()"
  >
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Anteprima</ion-title>
          <ion-button slot="end" fill="clear" (click)="closePreview()">
            <ion-icon slot="icon-only" name="close-outline"></ion-icon>
          </ion-button>
        </ion-toolbar>
      </ion-header>
      <ion-content class="preview-content">
        @if (selectedPhoto) {
          <ion-img [src]="selectedPhoto" class="preview-img"></ion-img>
        }
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
